name: Bigdatis Supabase Scraper

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional dataset key(s), e.g. apartment_sale or apartment_sale office_sale"
        required: false
        default: ""
      test_mode:
        description: "Run in test mode (10 listings per dataset)"
        required: false
        default: "false"
      no_headless:
        description: "Disable headless browser"
        required: false
        default: "false"
  schedule:
    - cron: "0 */6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
      SUPABASE_FLATTEN_COLUMNS: "1"
      SUPABASE_CHECKPOINT_SIZE: "20"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        shell: bash
        run: |
          set -euo pipefail

          ARGS=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
              ARGS="$ARGS --test"
            fi

            if [ -n "${{ github.event.inputs.only }}" ]; then
              ARGS="$ARGS --only ${{ github.event.inputs.only }}"
            fi

            if [ "${{ github.event.inputs.no_headless }}" = "true" ]; then
              ARGS="$ARGS --no-headless"
            fi
          fi

          echo "Running: python Bigdatis_agent_enriched.py $ARGS"
          python Bigdatis_agent_enriched.py $ARGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: ignore
